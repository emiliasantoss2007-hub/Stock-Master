name: CI - Stock Master

on:
  push:
    branches:
      - develop
      - main
      - chore/configura-ci

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Conferir arquivos do projeto
        run: |
          pwd
          ls -la
          node --version
          npm --version
          if [ -f package-lock.json ]; then
            echo "package-lock.json encontrado"
          else
            echo "package-lock.json NAO encontrado"
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes automatizados
        run: npm test